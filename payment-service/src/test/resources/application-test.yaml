server:
  port: 0

spring:
  application:
    name: payment-service-test
  datasource:
    url: jdbc:h2:mem:payment_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    generate-ddl: true
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        hbm2ddl:
          create_namespaces: true
        use_sql_comments: true
      org.hibernate.envers.audit_table_suffix: _history
      org.hibernate.envers.audit_table_prefix:
      org.hibernate.envers.default_schema: payment_bank_history
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security:
        protocol: PLAINTEXT
    ssl:
      enabled: false

user-service:
  jwt:
    secret: TXlWZXJ5TG9uZ0FuZFNlY3VyZVNlY3JldEtleUZvckpXVG9rZW5TaWduaW5nVGhhdElzQXRMZWFzdDY0Q2hhcnNsb25nVG9NZWV0SFM1MTJSZXF1aXJlbWVudHMxMjM0NTY3ODk=

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  kafka:
    bootstrap-servers: localhost:9092
    topic: payment-test
    transaction-topic: transaction-request-test
    inner-topic: payment-inner-test
    retry-topic: payment-retry-test
    group-id: payment-group-id-test
    retry-group-id: payment-retry-group-id-test
    dlt-topic: payment.DLT.test
    dlt-group-id: payment-group-id.dlt.test
    max-pull-records: 10
    partitions: 1
    replicas: 1
    timeout-seconds: 5
  retry:
    max-attempts: 2
    delay: 100
    multiplier: 1
    max-interval: 500
    timeout: 5

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    enabled: false

logging:
  level:
    com.github.seecret1.payment_service: DEBUG
    org.springframework.test: DEBUG
